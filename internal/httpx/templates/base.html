{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>netdb — {{.Title}}</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root {
    --bg:#0f1115; --fg:#e6e6e6; --dim:#9aa0a6; --line:#24262b;
    --accent:#7aa2f7; --danger:#f7768e; --good:#9ece6a; --card:#151821;
  }
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background: var(--bg); color: var(--fg); margin: 0; padding: 0; }
  header { border-bottom: 1px solid var(--line); padding: .75rem 1.25rem;
           display: flex; gap: 1.25rem; align-items: center; }
  header a { color: var(--fg); text-decoration: none; }
  header a.active { color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem; }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; color: var(--dim); font-weight: 500; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: .85rem; }
  form.inline { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .75rem 0; }
  input, select { background: var(--card); color: var(--fg); border: 1px solid var(--line);
                  padding: .4rem .55rem; border-radius: 4px; font-family: inherit; }
  button { background: var(--accent); color: #0b1020; border: 0; padding: .4rem .8rem;
           border-radius: 4px; font-family: inherit; cursor: pointer; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  .dim { color: var(--dim); }
  .tag { display:inline-block; background: var(--card); border: 1px solid var(--line);
         padding: 0 .4rem; border-radius: 3px; font-size: .8rem; margin-right: .25rem; }
  .empty { color: var(--dim); padding: 1rem 0; }
</style>
</head>
<body>
<header>
  <strong>netdb</strong>
  <a href="/hosts"     class="{{if eq .Nav "hosts"}}active{{end}}">hosts</a>
  <a href="/subnets"   class="{{if eq .Nav "subnets"}}active{{end}}">subnets</a>
  <a href="/zones"     class="{{if eq .Nav "zones"}}active{{end}}">zones</a>
  <a href="/providers" class="{{if eq .Nav "providers"}}active{{end}}">providers</a>
  <a href="/dns"       class="{{if eq .Nav "dns"}}active{{end}}">dns</a>
  <a href="/dhcp"      class="{{if eq .Nav "dhcp"}}active{{end}}">dhcp</a>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
